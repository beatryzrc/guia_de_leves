<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Digital · Veículos Leves — Vale</title>
<meta name="description" content="Central digital de consulta dos veículos leves: solicitações, valores, manutenção, documentos, abastecimento e contatos.">
<style>
:root{
  --teal:#007e7a; --teal-d:#005f5c; --teal-dd:#00403e; --teal-l:#e3f2f1; --teal-xl:#f1f9f8;
  --yellow:#ecb11f; --yellow-l:#fff4d6; --yellow-d:#8a6100;
  --grey:#747678; --ink:#1c2b2b; --muted:#5d6b6b; --line:#dfe6e6; --bg:#f3f6f6; --card:#fff;
  --red:#c8102e; --red-l:#fdeaed; --blue:#1d5fa8; --blue-l:#e8f0fa; --green:#2e7d32;
  --r:16px; --r-s:10px; --sh:0 1px 2px rgba(0,40,40,.06),0 4px 14px rgba(0,40,40,.06); --sh-l:0 10px 40px rgba(0,40,40,.18);
  --side:248px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal-d)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:200}
.skip:focus{left:8px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:var(--side);background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 14px;z-index:40}
.side .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.side .brand img{height:34px;width:auto}
.side .brand small{display:block;font-size:11px;color:var(--muted);line-height:1.2;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#33433f;text-decoration:none;font-weight:600;font-size:14.5px;transition:.15s}
.nav a svg{font-size:19px;color:var(--teal)}
.nav a:hover{background:var(--teal-xl)}
.nav a.on{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(0,126,122,.28)}
.nav a.on svg{color:#fff}
.side .sidefoot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--line)}
.side .sidefoot b{color:var(--ink)}
.mainwrap{margin-left:var(--side);flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px}
.top .mlogo{display:none;height:28px}
.search{position:relative;flex:1;max-width:560px}
.search input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:11px 44px 11px 44px;outline:none;transition:.15s}
.search input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(0,126,122,.12)}
.search>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--teal);font-size:18px}
.search .kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#fafcfc}
.drop{color:var(--ink);position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-l);max-height:70vh;overflow:auto;display:none;z-index:60;padding:8px}
.drop.open{display:block}
.drop h6{margin:8px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hit{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px}
.hit:hover,.hit.act{background:var(--teal-xl)}
.hit .ic{width:34px;height:34px;border-radius:10px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;flex:none}
.hit b{display:block;font-size:14px}
.hit span{display:block;font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1.5px solid transparent;padding:10px 16px;font-weight:700;font-size:14px;text-decoration:none;transition:.15s;white-space:nowrap}
.btn.pri{background:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal-d)}
.btn.sec{background:#fff;color:var(--teal-d);border-color:var(--teal)}.btn.sec:hover{background:var(--teal-xl)}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:#a50d26}
.btn.ghost{background:transparent;color:var(--teal-d)}.btn.ghost:hover{background:var(--teal-xl)}
.btn.sm{padding:7px 12px;font-size:13px}
.top .spacer{flex:1}
main{padding:26px 28px 90px;max-width:1360px;width:100%;margin:0 auto}
.foot{position:fixed;left:var(--side);right:0;bottom:0;z-index:25;background:var(--teal-dd);color:#e7f4f3;padding:9px 28px;font-size:12.5px;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.foot b{color:#fff}.foot a{color:var(--yellow);font-weight:700;text-decoration:none}
.foot .dot{width:8px;height:8px;border-radius:50%;background:#4cd37b;box-shadow:0 0 0 4px rgba(76,211,123,.25)}
.foot .grow{flex:1}

/* hero */
.hero{position:relative;z-index:6;border-radius:24px;background:linear-gradient(120deg,var(--teal-dd) 0%,var(--teal) 62%,#0a948f 100%);color:#fff;padding:36px 36px 32px;box-shadow:var(--sh)}
.hbg{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:0;pointer-events:none}
.hbg:before{content:"";position:absolute;right:-60px;top:-40px;width:420px;height:420px;background:var(--yellow);opacity:.95;border-radius:46% 54% 60% 40%/50% 40% 60% 50%;transform:rotate(18deg)}
.hbg:after{content:"";position:absolute;right:140px;bottom:-190px;width:380px;height:380px;background:rgba(255,255,255,.09);border-radius:50%}
.hero>*:not(.hbg){position:relative;z-index:1}
.hero .search{z-index:3}
.hero small{letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85;font-size:12px}
.hero h1{margin:6px 0 6px;font-size:clamp(26px,3.4vw,38px);line-height:1.12;max-width:640px}
.hero p{margin:0 0 20px;max-width:560px;opacity:.92;font-size:16px}
.hero .search{max-width:620px}
.hero .search input{padding:15px 50px;font-size:16px;border:0;box-shadow:0 8px 24px rgba(0,0,0,.2);color:var(--ink)}
.hero .tryrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center;font-size:13px}
.hero .tryrow button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.hero .tryrow button:hover{background:rgba(255,255,255,.28)}
body.is-home .top .search{visibility:hidden}

h2.sec{font-size:19px;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
h2.sec small{font-weight:500;color:var(--muted);font-size:13.5px}
h2.sec:before{content:"";width:5px;height:20px;border-radius:3px;background:var(--yellow)}

/* shortcuts */
.short{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:.18s;box-shadow:var(--sh);min-height:112px}
.sc:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 10px 26px rgba(0,126,122,.16)}
.sc .ic{width:42px;height:42px;border-radius:12px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;font-size:21px}
.sc b{font-size:15px;line-height:1.2}
.sc span{font-size:12.5px;color:var(--muted)}
.sc.emerg{background:var(--red);border-color:var(--red);color:#fff}
.sc.emerg .ic{background:rgba(255,255,255,.2);color:#fff}.sc.emerg span{color:#ffe3e7}
.sc.emerg:hover{box-shadow:0 10px 26px rgba(200,16,46,.35)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;box-shadow:var(--sh);position:relative;overflow:hidden;transition:.18s}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--teal)}
.kpi.y:before{background:var(--yellow)}.kpi.r:before{background:var(--red)}
.kpi:hover{transform:translateY(-2px);border-color:var(--teal)}
.kpi .n{font-size:26px;font-weight:800;color:var(--teal-d);line-height:1.1;letter-spacing:-.02em}
.kpi.y .n{color:#a87800}.kpi.r .n{color:var(--red)}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
.kpi.static{cursor:default}.kpi.static:hover{transform:none;border-color:var(--line)}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;text-align:left;box-shadow:var(--sh);transition:.18s;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.cat:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 12px 30px rgba(0,126,122,.16)}
.cat .ic{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--teal),#0aa39d);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 6px 14px rgba(0,126,122,.3)}
.cat h3{margin:6px 0 0;font-size:17px}
.cat p{margin:0;color:var(--muted);font-size:13.5px}
.cat .cnt{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--teal-d);display:flex;justify-content:space-between;align-items:center;padding-top:8px}

/* filters */
.fbar{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:14px 20px;flex-wrap:wrap;align-items:flex-end;box-shadow:var(--sh)}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:#42524f}
.seg button.on{background:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(0,126,122,.3)}
.sel{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;min-width:130px}
.fbar .clear{margin-left:auto}
.count{font-size:13.5px;color:var(--muted);margin:14px 2px 10px}
.count b{color:var(--ink)}

/* page header */
.ph{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.ph .ic{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--teal),#0aa39d);color:#fff;display:grid;place-items:center;font-size:28px;flex:none;box-shadow:0 8px 18px rgba(0,126,122,.3)}
.ph h1{margin:0;font-size:26px;line-height:1.15}
.ph p{margin:4px 0 0;color:var(--muted)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb a{text-decoration:none;font-weight:600}

/* process cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;box-shadow:var(--sh);transition:.18s;position:relative}
.pc:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 12px 28px rgba(0,126,122,.15)}
.pc.emerg{border-color:#f0b9c1;background:linear-gradient(180deg,#fff,#fff7f8)}
.pc .row{display:flex;gap:12px;align-items:flex-start}
.pc .ic{width:42px;height:42px;border-radius:12px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;font-size:20px;flex:none}
.pc.emerg .ic{background:var(--red-l);color:var(--red)}
.pc h4{margin:0;font-size:15.5px;line-height:1.25}
.pc p{margin:0;font-size:13.5px;color:var(--muted)}
.pc .foot2{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px;padding-top:2px}
.pc .go{color:var(--teal-d);font-weight:700;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--bg);color:#3d4d4a;white-space:nowrap}
.chip.lets{background:var(--teal-l);color:var(--teal-d)}
.chip.localiza{background:var(--yellow-l);color:var(--yellow-d)}
.chip.red{background:var(--red-l);color:var(--red)}
.chip.blue{background:var(--blue-l);color:var(--blue)}
.chip.time{background:#eef1f1;color:#2a3a38}
.empty{background:#fff;border:2px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted)}

/* list rows (home) */
.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rw{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;transition:.15s}
.rw:hover{border-color:var(--teal);background:var(--teal-xl)}
.rw .ic{width:36px;height:36px;border-radius:10px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;flex:none}
.rw b{display:block;font-size:14px;line-height:1.25}
.rw span{font-size:12.5px;color:var(--muted)}
.rw .chips{margin-left:auto;flex:none}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,30,30,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.md{background:#fff;border-radius:24px;width:min(860px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--sh-l);overflow:hidden;animation:pop .22s ease}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.md header{padding:20px 24px 16px;background:linear-gradient(120deg,var(--teal-dd),var(--teal));color:#fff;display:flex;gap:14px;align-items:flex-start;position:relative}
.md.em header{background:linear-gradient(120deg,#8d0a20,var(--red))}
.md header .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:24px;flex:none}
.md header h3{margin:0;font-size:20px;line-height:1.2}
.md header p{margin:5px 0 0;opacity:.92;font-size:14px}
.md header .chips{margin-top:10px}
.md header .chip{background:rgba(255,255,255,.18);color:#fff}
.xb{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.xb:hover{background:rgba(255,255,255,.32)}
.md .body{padding:18px 24px 6px;overflow:auto;flex:1}
.pz{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.pz div{background:var(--yellow-l);border:1px solid #f3dc9b;border-radius:12px;padding:10px 12px}
.pz b{display:block;font-size:19px;color:#7a5600;line-height:1.1}
.pz span{font-size:12px;color:#6d5a24}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--teal-d);border-color:var(--teal)}
.tabs button:hover{color:var(--teal-d)}
.blk{margin-bottom:16px}
.blk h5{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:2px 0 14px 46px;min-height:36px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;z-index:1}
ol.steps li:after{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--teal-l)}
ol.steps li:last-child:after{display:none}
ul.ck{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ul.ck li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
ul.ck li svg{color:var(--teal);margin-top:2px}
ul.ck.chk li{cursor:pointer;user-select:none}
ul.ck.chk li .bx{width:20px;height:20px;border:2px solid #9bb;border-radius:6px;flex:none;display:grid;place-items:center;color:#fff;margin-top:1px;background:#fff}
ul.ck.chk li.done{background:var(--teal-l);text-decoration:line-through;color:#4b6b68}
ul.ck.chk li.done .bx{background:var(--teal);border-color:var(--teal)}
.al{display:flex;gap:12px;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px;border:1px solid}
.al svg{margin-top:2px;font-size:18px}
.al.warn{background:var(--yellow-l);border-color:#f0d98e;color:#5b4500}
.al.danger{background:var(--red-l);border-color:#f3b4be;color:#7c0b1d}
.al.info{background:var(--blue-l);border-color:#bcd3ee;color:#173f6f}
.ctc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.cc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;background:#fff}
a.cc:hover{border-color:var(--teal);background:var(--teal-xl)}
.cc .ic{width:34px;height:34px;border-radius:10px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;flex:none}
.cc b{display:block;font-size:13.5px;line-height:1.2;word-break:break-word}
.cc span{font-size:12px;color:var(--muted)}
.md footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;background:#fafcfc;align-items:center}
.md footer .grow{flex:1}

/* valores */
.vtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.vtabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.vtabs button.on{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 4px 12px rgba(0,126,122,.28)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.panel h3{margin:0 0 4px;font-size:16.5px}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.hb{display:grid;gap:9px}
.hr{display:grid;grid-template-columns:210px 1fr 98px;gap:10px;align-items:center;font-size:13px}
.hr .lb{line-height:1.2}.hr .lb small{display:block;color:var(--muted);font-size:11.5px}
.hr .tr{background:var(--bg);border-radius:999px;height:16px;overflow:hidden}
.hr .br{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),#13b1aa);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hr .vl{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.hr.hl .br{background:linear-gradient(90deg,var(--yellow),#f5cd5d)}
.gr{display:grid;gap:14px}
.gg{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center}
.gg .bars{display:grid;gap:4px}
.gg .bar{display:grid;grid-template-columns:1fr 54px;gap:8px;align-items:center;font-size:12px}
.gg .bar .tr{background:var(--bg);height:11px;border-radius:99px;overflow:hidden}
.gg .bar .br{height:100%;border-radius:99px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gg .bar b{text-align:right;font-variant-numeric:tabular-nums}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-bottom:12px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--teal-xl);color:var(--teal-dd);font-size:12px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;white-space:nowrap}
th.s{cursor:pointer;user-select:none}th.s:hover{background:var(--teal-l)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfefd}
.pill{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--teal-l);color:var(--teal-d)}
.mo{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.moc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border-top:5px solid var(--teal)}
.moc:nth-child(2){border-top-color:#13b1aa}.moc:nth-child(3){border-top-color:var(--yellow)}.moc:nth-child(4){border-top-color:var(--grey)}
.moc .rg{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--teal-d)}
.moc .vv{font-size:24px;font-weight:800;margin:6px 0;letter-spacing:-.02em}
.moc p{margin:0;font-size:13px;color:var(--muted)}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld .sel,.fld input[type=number]{width:100%;border-radius:12px;padding:10px 12px;border:1.5px solid var(--line);background:#fff}
input[type=range]{width:100%;accent-color:var(--teal)}
.res{background:linear-gradient(135deg,var(--teal-dd),var(--teal));color:#fff;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px}
.res .big{font-size:36px;font-weight:800;letter-spacing:-.02em}
.res .ln{display:flex;justify-content:space-between;font-size:14px;border-top:1px solid rgba(255,255,255,.2);padding-top:8px}
.res small{opacity:.8}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:0;position:relative}
.tl .st{position:relative;text-align:center;padding:0 8px}
.tl .st:before{content:"";position:absolute;top:22px;left:-50%;right:50%;height:3px;background:var(--teal-l)}
.tl .st:first-child:before{display:none}
.tl .dot{width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;margin:0 auto 8px;position:relative;z-index:1;box-shadow:0 0 0 5px var(--teal-l);font-size:20px}
.tl .st.y .dot{background:var(--yellow);color:#4a3600;box-shadow:0 0 0 5px var(--yellow-l)}
.tl b{display:block;font-size:13px;line-height:1.2}
.tl span{font-size:12px;color:var(--muted)}
.tl .tm{display:block;width:max-content;margin:5px auto 0;background:var(--yellow-l);color:var(--yellow-d);border-radius:99px;padding:1px 9px;font-weight:700;font-size:12px}

/* postos */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.po{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.po h4{margin:0;font-size:15px}
.po .ad{font-size:13px;color:var(--muted)}
.po .rw2{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.po a{font-weight:700;font-size:13px;text-decoration:none;display:inline-flex;gap:5px;align-items:center}

/* contacts */
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ct{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.ct .hd{display:flex;gap:10px;align-items:center}
.ct .ic{width:38px;height:38px;border-radius:11px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;flex:none}
.ct h4{margin:0;font-size:15px;line-height:1.2}.ct small{color:var(--muted)}
.ct .ln{display:flex;gap:8px;align-items:center;font-size:13.5px;text-decoration:none;color:var(--ink);padding:5px 0;border-top:1px dashed var(--line);word-break:break-word}
.ct a.ln:hover{color:var(--teal-d)}
.ct .nt{font-size:12.5px;color:var(--muted)}
.lk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.ft{font-size:12px;color:var(--muted);margin-top:30px;text-align:center}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300}
.toast.on{opacity:1;transform:translateX(-50%)}

.bottom{display:none}

/* responsive */
@media (max-width:1180px){
  .short{grid-template-columns:repeat(2,1fr)}
  .cats,.grid,.cg,.lk,.pg{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .mo{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .side{display:none}
  .mainwrap{margin-left:0}
  .top{padding:10px 14px}
  .top .mlogo{display:block}
  .top .search{max-width:none;min-width:0}
  .top .spacer{display:none}
  .search .kbd{display:none}
  .top .btn{flex:none}
  .top .mlogo{flex:none}
  .top .btn.cen span.t,.top .btn.eme span.t{display:none}
  .top .btn{padding:10px 12px}
  main{padding:16px 14px 150px}
  .foot{left:0;bottom:60px;padding:8px 14px;font-size:12px;gap:8px 14px}
  .foot .hide-m{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;box-shadow:0 -4px 16px rgba(0,40,40,.08)}
  .bottom a{flex:1 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:11px;font-weight:700;color:#4a5a57;padding:6px 8px;border-radius:12px}
  .bottom a svg{font-size:21px}
  .bottom a.on{color:var(--teal-d);background:var(--teal-l)}
  .hero{padding:24px 20px;border-radius:20px}
  .hbg:before{width:260px;height:260px;right:-90px;top:-70px}
  .rows{grid-template-columns:1fr}
  .tl{grid-template-columns:1fr;gap:14px}
  .tl .st{display:grid;grid-template-columns:50px 1fr;text-align:left;align-items:center;padding:0}
  .tl .st:before{display:none}.tl .dot{margin:0}.tl .tm{margin:5px 0 0}
  .sim{grid-template-columns:1fr}
  .hr{grid-template-columns:1fr 90px}
  .hr .lb{grid-column:1/-1}
  .hr .tr{grid-column:1}
  .gg{grid-template-columns:1fr}
  .ov{padding:0;align-items:flex-end}
  .md{border-radius:22px 22px 0 0;max-height:94vh;width:100%}
  .md header{padding:16px}.md .body{padding:14px 16px 4px}.md footer{padding:10px 16px;flex-wrap:nowrap;overflow-x:auto}.md footer .btn{flex:none}.md footer .grow{display:none}
}
@media (max-width:620px){
  .short{grid-template-columns:repeat(2,1fr);gap:10px}
  .sc{min-height:96px;padding:12px}
  .cats,.grid,.cg,.lk,.pg,.mo,.kpis{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi .n{font-size:21px}
  .ph .ic{width:48px;height:48px;font-size:23px}.ph h1{font-size:21px}
  .fbar{gap:12px}.fbar .clear{margin-left:0}
  .seg{flex-wrap:wrap;border-radius:16px}
  th,td{padding:8px 9px;font-size:13px}
  .rw .chips{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2200)}
function copyText(t){
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Link copiado')}catch(e){toast('Não foi possível copiar')}a.remove()};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Link copiado'),fb)}else fb();
}
function matchProc(p){
  if(F.loc!=='todas'&&!p.loc.includes(F.loc))return false;
  if(F.un!=='todas'&&!p.un.includes(F.un))return false;
  if(F.tipo!=='todos'&&p.tipo!==F.tipo)return false;
  if(F.canal!=='todos'&&!p.canais.includes(F.canal))return false;
  if(F.perfil!=='todos'&&!p.perfis.includes(F.perfil))return false;
  return true;
}

/* ====================== COMPONENTES ====================== */
function chipsProc(p,full){
  const c=[];
  if(p.tipo==='Emergência')c.push(`<span class="chip red">${ico('alert')} Emergência</span>`);else c.push(`<span class="chip blue">${p.tipo}</span>`);
  if(p.loc.length===2)c.push('<span class="chip">Let\'s e Localiza</span>');else c.push(`<span class="chip ${p.loc[0]}">${LOCN[p.loc[0]]}</span>`);
  if(p.un.length===1)c.push(`<span class="chip">Só ${p.un[0]}</span>`);
  if(full)p.canais.forEach(x=>c.push(`<span class="chip">${x}</span>`));
  return `<div class="chips">${c.join('')}</div>`;
}
function procCard(p){
  return `<button class="pc ${p.emerg?'emerg':''}" data-p="${p.id}" aria-label="Abrir: ${p.titulo}">
   <div class="row"><div class="ic">${ico(p.icon)}</div><div><h4>${p.titulo}</h4></div></div>
   <p>${p.resumo}</p>${chipsProc(p)}
   <div class="foot2">${p.prazo?`<span class="chip time">${ico('clock')} ${p.prazo}</span>`:'<span></span>'}<span class="go">Ver como fazer ${ico('chev')}</span></div></button>`;
}
function filterBar(){
  const seg=(k,opts)=>`<div class="seg" role="group" aria-label="${k}">${opts.map(([v,l])=>`<button data-f="${k}" data-v="${v}" class="${F[k]===v?'on':''}" aria-pressed="${F[k]===v}">${l}</button>`).join('')}</div>`;
  const canais=['VSC','ValeForms','Power Apps','SGC','Power BI','WhatsApp','E-mail','Telefone'];
  const perfis=['Empregado','Supervisor/Coordenador','Analista'];
  return `<div class="fbar" role="region" aria-label="Filtros">
   <div class="fg"><label>Locadora</label>${seg('loc',[['todas','Todas'],['lets','Let\'s'],['localiza','Localiza']])}</div>
   <div class="fg"><label>Unidade</label>${seg('un',[['todas','Todas'],['TU','TU'],['EFVM','EFVM']])}</div>
   <div class="fg"><label>Tipo de demanda</label>${seg('tipo',[['todos','Todos'],['Solicitar','Solicitar'],['Consultar','Consultar'],['Emergência','Emergência']])}</div>
   ${filtActive()?`<button class="btn ghost sm clear" id="fclear">${ico('x')} Limpar filtros</button>`:''}</div>`;
}
function bindFilters(rerender){
  $$('[data-f]').forEach(b=>b.onclick=()=>{F[b.dataset.f]=b.dataset.v;saveF();rerender()});
  $$('[data-fs]').forEach(s=>s.onchange=()=>{F[s.dataset.fs]=s.value;saveF();rerender()});
  const c=$('#fclear');if(c)c.onclick=()=>{F={loc:'todas',un:'todas',tipo:'todos',canal:'todos',perfil:'todos'};saveF();rerender()};
}

}

function groups(arr){return ['Todos',...new Set(arr.map(a=>a.g))]}
function gchips(arr,cur,key){return `<div class="seg" style="flex-wrap:wrap;border-radius:16px">${groups(arr).map(g=>`<button data-gv="${key}" data-v="${g}" class="${cur===g?'on':''}">${g}</button>`).join('')}</div>`}

    $$('[data-mt]',body).forEach(b=>b.onclick=()=>{VM.metric=b.dataset.mt;draw()});
    $$('[data-sk]',body).forEach(h=>h.onclick=()=>{const k=h.dataset.sk;VM.sort=VM.sort.k===k?{k,d:-VM.sort.d}:{k,d:1};draw()});
    $$('[data-dk]',body).forEach(h=>h.onclick=()=>{const k=h.dataset.dk;VD.sort=VD.sort.k===k?{k,d:-VD.sort.d}:{k,d:1};draw()});
    const q=$('#vq',body);if(q){q.oninput=()=>{VM.q=q.value;const pos=q.selectionStart;draw();const n=$('#vq');n.focus();n.setSelectionRange(pos,pos)}}
    $$('[data-sm]',body).forEach(b=>b.onclick=()=>{SIM.mode=b.dataset.sm;draw()});
    $$('[data-sp]',body).forEach(b=>b.onclick=()=>{SIM.plano=b.dataset.sp;draw()});
    const sc=$('#sc',body);if(sc)sc.onchange=()=>{SIM.mode==='m'?SIM.cat=+sc.value:SIM.dcat=+sc.value;simCalc()};
    const km=$('#skm',body);if(km)km.oninput=()=>{SIM.km=+km.value;$('#skmv').textContent=SIM.km.toLocaleString('pt-BR')+' km';simCalc()};
    const di=$('#sdi',body);if(di)di.oninput=()=>{SIM.dias=+di.value;$('#sdiv').textContent=SIM.dias;simCalc()};
    $$('[data-p]',body).forEach(b=>b.onclick=()=>openProc(b.dataset.p));
    simCalc();animateBars();
  };
  draw();
  $$('[data-vt]').forEach(b=>b.onclick=()=>{VT=b.dataset.vt;history.replaceState(null,'','#/valores/'+VT);$$('[data-vt]').forEach(x=>x.classList.toggle('on',x===b));draw()});
}

/* ---- Abastecimento ---- */

  <h2 class="sec" id="lavagem">Postos para lavagem <small>pagamento com o cartão de abastecimento</small></h2>

    <div class="fg"><label>Cidade</label><div class="seg">${['Todas','Serra','Vitória'].map(c=>`<button data-pc="${c}" class="${PO.c===c?'on':''}">${c}</button>`).join('')}</div></div>
    <div class="fg" style="flex:1;min-width:220px"><label for="pq">Buscar bairro, posto ou rua</label><input class="sel" style="width:100%;border-radius:12px" id="pq" value="${PO.q}" placeholder="Ex.: Camburi, Marlin, Dante Michelini"></div></div>

function drawPostos(){

function bindAbast(){
  bindCat();drawPostos();
  $$('[data-pc]').forEach(b=>b.onclick=()=>{PO.c=b.dataset.pc;$$('[data-pc]').forEach(x=>x.classList.toggle('on',x===b));drawPostos()});
  $('#pq').oninput=e=>{PO.q=e.target.value;drawPostos()};
  if(location.hash.endsWith('#lavagem')){setTimeout(()=>$('#lavagem')?.scrollIntoView(),50)}
}

/* ---- Contatos ---- */
function ctcCard(c){
  return `<div class="ct"><div class="hd"><div class="ic">${ico(c.icon)}</div><div><h4>${c.nome}</h4><small>${c.grupo}</small></div></div><div class="nt">${c.papel}</div>${c.linhas.map(l=>`<a class="ln" href="${l.h}" ${l.h.startsWith('http')?'target="_blank" rel="noopener"':''}>${ico(l.i)} ${l.t}</a>`).join('')}${c.nota?`<div class="nt"><b>${c.nota}</b></div>`:''}</div>`;
}
let CQ={g:'Todos'};
function pageContatos(){
  const gs=['Todos',...new Set(CONTATOS.map(c=>c.grupo))];
  const links=[['grid','Portal de autoatendimento','Transporte TU e EFVM — orientações, serviços, selo MEV e cartão de abastecimento',U.portal],['box','Serviços de Transporte (Power Apps)','Principais links e formulários de autoatendimento',U.pwrServicos],['link','VSC — Vale Service Catalog','Mobilização, alteração e desmobilização',U.vsc],['eye','Inventário geral (Power BI)','Veículos sob sua responsabilidade',U.inventario],['chart','BI de medição','Valores pagos em medição',U.biMedicao],['idcard','SGC Mobilização','Emissão e renovação do selo MEV',U.sgc]];
  return pageHeader(CAT('contatos'))+`
  <div class="panel" style="border-left:6px solid var(--teal)"><h3>Central de Transporte TU e EFVM</h3><div class="sub" style="margin-bottom:12px">Canal oficial para entrada, gestão e direcionamento de todas as demandas da Coordenação de Transporte. Quando necessário, a Central aciona o analista responsável.</div>
   <div class="chips" style="margin-bottom:14px"><span class="chip time">${ico('clock')} Diário · 7h às 19h</span><span class="chip time">Resposta média até 5 min</span><span class="chip time">Ordem de chegada</span></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/552733332100">${ico('wa')} WhatsApp (27) 3333-2100</a><a class="btn sec" href="mailto:Transporte.TU.EFVM@vale.com">${ico('mail')} Transporte.TU.EFVM@vale.com</a></div></div>
  <h2 class="sec">Contatos <small>filtre por grupo</small></h2>
  <div class="seg" style="flex-wrap:wrap;border-radius:16px;margin-bottom:14px">${gs.map(g=>`<button data-cg="${g}" class="${CQ.g===g?'on':''}">${g}</button>`).join('')}</div>
  <div class="cg" id="cgrid"></div>
  <h2 class="sec">Plataformas e sistemas</h2>
  <div class="lk">${links.map(l=>`<a class="ct" style="text-decoration:none;color:inherit" href="${l[3]}" target="_blank" rel="noopener"><div class="hd"><div class="ic">${ico(l[0])}</div><div><h4>${l[1]}</h4></div><span style="margin-left:auto;color:var(--teal)">${ico('ext')}</span></div><div class="nt">${l[2]}</div></a>`).join('')}</div>
  <h2 class="sec">Sobre este painel</h2>
  <div class="panel"><h3>Objetivo</h3><div class="sub" style="margin:0">Orientar as áreas envolvidas sobre as principais diretrizes e dúvidas do processo de Transporte Leve — Frota, Mão de Obra, Abastecimento, Equipamentos Embarcados, Táxi e Transporte Coletivo —, garantindo alinhamento e eficiência operacional.</div></div>`;
}
function bindContatos(){
  const draw=()=>{$('#cgrid').innerHTML=CONTATOS.filter(c=>CQ.g==='Todos'||c.grupo===CQ.g).map(ctcCard).join('')};draw();
  $$('[data-cg]').forEach(b=>b.onclick=()=>{CQ.g=b.dataset.cg;$$('[data-cg]').forEach(x=>x.classList.toggle('on',x===b));draw()});
}

/* ---- Busca ---- */
function buildIndex(){
  const idx=[];
  PROCS.forEach(p=>{
    const txt=strip(p.titulo+' '+p.resumo+' '+p.kw+' '+JSON.stringify(p.det.tabs.map(t=>t.blocks.map(b=>[b.title,b.items,b.x,b.t==='alert'?b.x:''])))+' '+(p.det.alertas||[]).map(a=>a.x).join(' ')+' '+(p.det.acoes||[]).map(a=>a.l).join(' '));
    idx.push({k:'Processo',t:p.titulo,s:p.resumo,i:p.icon,h:norm(p.titulo+' '+p.kw+' '+txt),w:5,run:()=>openProc(p.id),extra:CAT(p.cat).nome});
  });
  MENSAL.forEach(r=>idx.push({k:'Valores',t:r.n+' — '+BRL(r.v)+'/mês',s:r.m+' · km excedente '+BRL(r.x,2),i:'money',h:norm(r.n+' '+r.m+' valor franquia mensal locação preço '+r.g),w:2,run:()=>{VM.q=r.n;nav('#/valores/mensal')}}));
  DIARIA.forEach(r=>idx.push({k:'Valores',t:r.n+' — diária '+BRL(r.d),s:r.m+' · semanal '+BRL(r.s)+' · quinzenal '+BRL(r.q),i:'cal',h:norm(r.n+' '+r.m+' diária semanal quinzenal preço valor'),w:2,run:()=>{nav('#/valores/diaria')}}));
  REGIMES.forEach(r=>idx.push({k:'Valores',t:r.r+' — '+BRL(r.v,2),s:r.d,i:'users',h:norm(r.r+' '+r.t+' '+r.d+' mão de obra regime valor'),w:2,run:()=>{nav('#/valores/mo')}}));
  POSTOS.forEach(p=>idx.push({k:'Posto de lavagem',t:p.nome,s:p.end+' · '+p.bairro+' · '+p.cid+'/ES',i:'drop',h:norm(p.nome+' '+p.end+' '+p.bairro+' '+p.cid+' lavagem posto lava jato'),w:1,run:()=>{PO.q=p.nome;PO.c='Todas';nav('#/abastecimento#lavagem')}}));
  CONTATOS.forEach(c=>idx.push({k:'Contato',t:c.nome,s:c.linhas.map(l=>l.t).join(' · '),i:c.icon,h:norm(c.nome+' '+c.papel+' '+c.linhas.map(l=>l.t).join(' ')+' '+c.grupo),w:3,run:()=>{CQ.g=c.grupo;nav('#/contatos')}}));
  return idx;
}
let IDX=null;
function doSearch(q){
  IDX=IDX||buildIndex();
  const toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return[];
  return IDX.map(e=>{
    if(!toks.every(t=>e.h.includes(t)))return null;
    const tt=norm(e.t);let sc=e.w;toks.forEach(t=>{if(tt.includes(t))sc+=6});
    return {e,sc};
  }).filter(Boolean).sort((a,b)=>b.sc-a.sc).map(x=>x.e);
}
function attachSearch(inp,drop){
  if(!inp)return;let act=-1,cur=[];
  const render=()=>{
    const q=inp.value.trim();
    if(!q){drop.classList.remove('open');return}
    cur=doSearch(q).slice(0,9);act=-1;
    if(!cur.length){drop.innerHTML=`<div style="padding:16px;color:var(--muted)">Nada encontrado para “${q.replace(/</g,'&lt;')}”. Tente outra palavra ou fale com a Central.</div>`}
    else{let last='';drop.innerHTML=cur.map((e,i)=>{const h=e.k!==last?`<h6>${e.k}</h6>`:'';last=e.k;return `${h}<button class="hit" data-i="${i}"><div class="ic">${ico(e.i)}</div><div><b>${e.t}</b><span>${e.s.length>110?e.s.slice(0,108)+'…':e.s}</span></div></button>`}).join('')+`<button class="hit" data-all="1"><div class="ic">${ico('search')}</div><div><b>Ver todos os resultados</b><span>${doSearch(q).length} encontrados</span></div></button>`}
    drop.classList.add('open');
    $$('.hit[data-i]',drop).forEach(b=>b.onclick=()=>{const e=cur[+b.dataset.i];drop.classList.remove('open');e.run()});
    const al=$('.hit[data-all]',drop);if(al)al.onclick=()=>{drop.classList.remove('open');location.hash='#/busca/'+encodeURIComponent(q)};
  };
  inp.addEventListener('input',render);inp.addEventListener('focus',render);
  inp.addEventListener('keydown',e=>{
    const hits=$$('.hit',drop);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!hits.length)return;act=(act+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;hits.forEach((h,i)=>h.classList.toggle('act',i===act));hits[act].scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();if(act>=0)hits[act].click();else if(inp.value.trim()){drop.classList.remove('open');location.hash='#/busca/'+encodeURIComponent(inp.value.trim())}}
    else if(e.key==='Escape'){drop.classList.remove('open');inp.blur()}
  });
  document.addEventListener('click',e=>{if(!inp.parentElement.contains(e.target))drop.classList.remove('open')});
}
function pageBusca(q){
  const res=doSearch(q);const by={};res.forEach(r=>(by[r.k]=by[r.k]||[]).push(r));
  window.__res=res;
  return `<div class="crumb"><a href="#/inicio">Início</a> › Busca</div><div class="ph"><div class="ic">${ico('search')}</div><div><h1>Resultados para “${q.replace(/</g,'&lt;')}”</h1><p>${res.length} resultado${res.length!==1?'s':''} encontrado${res.length!==1?'s':''}</p></div></div>
  ${res.length?Object.entries(by).map(([k,l])=>`<h2 class="sec">${k} <small>${l.length}</small></h2><div class="rows">${l.map(e=>`<button class="rw" data-r="${window.__res.indexOf(e)}"><div class="ic">${ico(e.i)}</div><div><b>${e.t}</b><span>${e.s.length>130?e.s.slice(0,128)+'…':e.s}</span></div></button>`).join('')}</div>`).join(''):`<div class="empty">Nada encontrado. Tente outras palavras (ex.: “selo”, “manutenção”, “diária”) ou fale com a Central.<br><br><button class="btn pri sm" id="cc">Falar com a Central</button></div>`}`;
}
function bindBusca(){$$('[data-r]').forEach(b=>b.onclick=()=>window.__res[+b.dataset.r].run());const c=$('#cc');if(c)c.onclick=openCentral}

/* ====================== MODAL ====================== */
let MODAL={p:null,tab:0};
function ctcMini(c){
  const l=c.linhas[0];
  return c.linhas.map(l=>`<a class="cc" href="${l.h}" ${l.h.startsWith('http')?'target="_blank" rel="noopener"':''}><div class="ic">${ico(l.i)}</div><div><b>${l.t}</b><span>${c.nome}</span></div></a>`).join('');
}
function renderBlock(b,pid,ti,bi){
  if(b.t==='steps')return `<div class="blk"><ol class="steps">${b.items.map(i=>`<li>${i}</li>`).join('')}</ol></div>`;
  if(b.t==='list')return `<div class="blk">${b.title?`<h5>${b.title}</h5>`:''}<ul class="ck">${b.items.map(i=>`<li>${ico('check')}<span>${i}</span></li>`).join('')}</ul></div>`;
  if(b.t==='check')return `<div class="blk">${b.title?`<h5>${b.title} <span style="text-transform:none;letter-spacing:0;font-weight:500">— toque para marcar</span></h5>`:''}<ul class="ck chk">${b.items.map((i,n)=>`<li role="checkbox" tabindex="0" aria-checked="false" data-ck="${pid}-${ti}-${bi}-${n}"><span class="bx">${ico('check')}</span><span>${i}</span></li>`).join('')}</ul></div>`;
  if(b.t==='alert')return `<div class="al ${b.k}">${ico(b.k==='info'?'info':'alert')}<div>${b.x}</div></div>`;
  if(b.t==='chips')return `<div class="blk"><h5>${b.title}</h5><div class="chips">${b.items.map(i=>`<span class="chip ${i.startsWith('ES')||i.startsWith('MG')?'':''}">${ico('pin')} ${i}</span>`).join('')}</div></div>`;
  if(b.t==='contacts')return `<div class="blk"><h5>Contatos</h5><div class="ctc">${b.ids.map(id=>ctcMini(C(id))).join('')}</div></div>`;
  return '';
}
function openProc(id,tab){
  const p=P(id);if(!p)return;
  const d=p.det;let ti=0;
  if(typeof tab==='number')ti=tab;
  else if(F.loc!=='todas'){const k=d.tabs.findIndex(t=>t.loc===F.loc);if(k>=0)ti=k}
  MODAL={p,tab:ti};drawModal();
  const ov=$('#ov');ov.classList.add('open');ov.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  setTimeout(()=>$('#md .xb')?.focus(),30);
}
function drawModal(){
  const {p,tab}=MODAL,d=p.det;
  const t=d.tabs[tab];
  const acoes=(d.acoes||[]).map(a=>{
    const cls=a.p?'btn pri sm':'btn sec sm';
    if(a.u)return `<a class="${cls}" href="${a.u}" target="${a.u.startsWith('mailto')?'_self':'_blank'}" rel="noopener">${ico(a.u.startsWith('mailto')?'mail':'ext')} ${a.l}</a>`;
    if(a.go)return `<button class="${cls}" data-mgo="${a.go}">${ico('chev')} ${a.l}</button>`;
    if(a.proc)return `<button class="${cls}" data-mproc="${a.proc}">${ico('chev')} ${a.l}</button>`;
    return '';}).join('');
  $('#md').className='md'+(p.emerg?' em':'');
  $('#md').innerHTML=`
  <header><div class="ic">${ico(p.icon)}</div><div><h3 id="mdT">${p.titulo}</h3><p>${p.resumo}</p>${chipsProc(p,true)}</div><button class="xb" aria-label="Fechar">${ico('x')}</button></header>
  <div class="body">
   ${d.prazos?`<div class="pz">${d.prazos.map(z=>`<div><b>${z[0]}</b><span>${z[1]}</span></div>`).join('')}</div>`:''}
   ${(d.alertas||[]).map(a=>`<div class="al ${a.k}">${ico('alert')}<div>${a.x}</div></div>`).join('')}
   ${d.tabs.length>1?`<div class="tabs" role="tablist">${d.tabs.map((x,i)=>`<button role="tab" aria-selected="${i===tab}" data-mt="${i}" class="${i===tab?'on':''}">${x.label}</button>`).join('')}</div>`:''}
   ${t.blocks.map((b,bi)=>renderBlock(b,p.id,tab,bi)).join('')}
  </div>
  <footer>${acoes}<span class="grow"></span><button class="btn ghost sm" id="mcopy">${ico('copy')} Copiar link</button></footer>`;
  $('#md .xb').onclick=closeModal;
  $$('#md [data-mt]').forEach(b=>b.onclick=()=>{MODAL.tab=+b.dataset.mt;drawModal();$('#md .body').scrollTop=0});
  $$('#md [data-mgo]').forEach(b=>b.onclick=()=>{closeModal();location.hash=b.dataset.mgo});
  $$('#md [data-mproc]').forEach(b=>b.onclick=()=>openProc(b.dataset.mproc));
  $('#mcopy').onclick=()=>copyText(location.href.split('#')[0]+'#/p/'+p.id);
  $$('#md [data-ck]').forEach(li=>{
    const k='vl_ck_'+li.dataset.ck;let on=false;try{on=sessionStorage.getItem(k)==='1'}catch(e){}
    const set=v=>{li.classList.toggle('done',v);li.setAttribute('aria-checked',v);try{sessionStorage.setItem(k,v?'1':'0')}catch(e){}};
    set(on);const tg=()=>set(!li.classList.contains('done'));
    li.onclick=tg;li.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tg()}};
  });
}
function closeModal(){
  const ov=$('#ov');ov.classList.remove('open');ov.setAttribute('aria-hidden','true');document.body.style.overflow='';
  if(/^#\/p\//.test(location.hash)){const c=MODAL.p?MODAL.p.cat:'inicio';history.replaceState(null,'','#/'+c)}
}
function openCentral(){
  MODAL={p:{id:'central',cat:'contatos',icon:'wa',titulo:'Falar com a Central de Transporte',resumo:'Canal oficial para todas as demandas da Coordenação de Transporte TU e EFVM.',tipo:'Consultar',loc:['lets','localiza'],un:['TU','EFVM'],canais:['WhatsApp','E-mail'],
   det:{prazos:[['7h–19h','Atendimento diário'],['até 5 min','Tempo médio de resposta, conforme a demanda']],tabs:[{id:'a',label:'Contato',blocks:[{t:'contacts',ids:['central']},{t:'alert',k:'info',x:'O atendimento é por <b>ordem de chegada</b>. Se necessário, a Central aciona o analista responsável para dar continuidade.'}]}],
   acoes:[{l:'Abrir WhatsApp',u:'https://wa.me/552733332100',p:1},{l:'Enviar e-mail',u:'mailto:Transporte.TU.EFVM@vale.com'}]}},tab:0};
  drawModal();const ov=$('#ov');ov.classList.add('open');document.body.style.overflow='hidden';
}

/* ====================== ROTEADOR ====================== */
function route(keep){
  const raw=location.hash.replace(/^#\/?/,'');
  const hashPart=raw.split('#')[0];
  const parts=hashPart.split('/');let page=parts[0]||'inicio',openId=null;
  if(page==='p'){openId=parts[1];const p=P(openId);page=p?p.cat:'inicio'}
  const main=$('#main');
  document.body.classList.toggle('is-home',page==='inicio');
  const navId=page==='busca'?'':page;renderNav(navId);
  if(page==='inicio'){main.innerHTML=pageHome();bindHome()}
  else if(page==='frota'){main.innerHTML=pageFrota();bindFrota()}
  else if(page==='valores'){main.innerHTML=pageValores(parts[1]);bindValores()}
  else if(page==='manutencao'||page==='documentos'){const c=CAT(page);main.innerHTML=pageHeader(c)+procSection(page)+(page==='manutencao'?`<div class="al info" style="margin-top:18px">${ico('info')}<div>Em caso de <b>colisão</b>, registre o B.O. na hora. Ele pode ser emitido online nos portais da Polícia Civil do ES ou de MG.</div></div>`:'');bindCat()}
  else if(page==='abastecimento'){main.innerHTML=pageAbast();bindAbast()}
  else if(page==='contatos'){main.innerHTML=pageContatos();bindContatos()}
  else if(page==='busca'){const q=decodeURIComponent(parts[1]||'');main.innerHTML=pageBusca(q);bindBusca();const i=$('#q1');if(i&&!i.value)i.value=q}
  else{location.hash='#/inicio';return}
  if(!keep){window.scrollTo({top:0});}
  if(openId&&!keep)openProc(openId);
  document.title=(page==='inicio'?'':(CAT(page)?CAT(page).nome+' · ':''))+'Central Digital · Veículos Leves — Vale';
}

/* ====================== INIT ====================== */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#ov').classList.contains('open'))closeModal();
  if((e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName))||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();const i=document.body.classList.contains('is-home')&&$('#q2')?$('#q2'):$('#q1');i.focus();i.select()}
});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
$('#btnEmerg').onclick=()=>openProc('sinistro');
$('#btnCentral').onclick=openCentral;
attachSearch($('#q1'),$('#d1'));
window.addEventListener('hashchange',()=>route());
route();
</script>
